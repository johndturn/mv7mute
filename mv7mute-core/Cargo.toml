[package]
name = "mv7mute-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Core MV7 mute and lock control logic"
repository = "https://github.com/Justkant/mv7mute"
readme = "../README.md"
license = "MIT"
keywords = ["mv7", "shure", "mute", "audio"]
categories = ["hardware-support"]

[dependencies]
hidapi = "2.6.5"

# macOS: open the MV7 shared instead of seizing it (hidapi defaults to exclusive), so other apps
# using the mic's HID interface keep working. Keep the version in sync with the line above.
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.5", features = ["macos-shared-device"] }
